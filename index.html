<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Block Builder</title>

  <!-- Roboto (pesos hasta 600, jamás más) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN (Capa A). Tokens Gamonal. Nunca se usa en el export de piezas. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { g: {
          azul: "#040764", azul2: "#1C73CB", turquesa: "#20B6B6",
          amarillo: "#FCE865", magenta: "#B318A3",
          gris: "#3B3B3B", grisclr: "#F5F5F5",
        } },
        fontFamily: { sans: ["Roboto", "system-ui", "sans-serif"] },
      } },
    };
  </script>

  <link rel="stylesheet" href="./css/gamonal.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./js/ui/app.js"></script>
</body>
</html>
