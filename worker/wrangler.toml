# Configuración de Cloudflare Workers para speedy-graph.gamonal.app
# Despliegue: ver worker/README.md.
#
# PRIMER DEPLOY (solo el editor, sin trabarse): así como está, corre:
#   cd worker && wrangler deploy
#
# Para activar el backend (Char-B, guardar, subir imágenes) descomenta los bloques
# [[d1_databases]] y [[r2_buckets]] de abajo, crea los recursos y vuelve a desplegar.

name = "speedy-graph"
main = "worker.js"
compatibility_date = "2026-01-01"

# Sirve el editor estático (la raíz del repo: index.html, css/, js/).
[assets]
directory = "../"
binding = "ASSETS"

[vars]
APP = "speedy-graph"

# ─────────────────────────────────────────────────────────────────────────────
# BACKEND (descomenta cuando quieras Char-B / guardado / imágenes)
#
# Base de datos D1 (proyectos). Crea con: wrangler d1 create speedy-graph
# [[d1_databases]]
# binding = "DB"
# database_name = "speedy-graph"
# database_id = "REEMPLAZAR_CON_TU_DATABASE_ID"
#
# Bucket R2 (imágenes). Crea con: wrangler r2 bucket create speedy-graph-img
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "speedy-graph-img"
#
# Y el secreto de Char-B: wrangler secret put ANTHROPIC_API_KEY
# ─────────────────────────────────────────────────────────────────────────────
